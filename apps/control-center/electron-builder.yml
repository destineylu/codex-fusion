appId: io.github.codex-router.control-center
# v1 compatibility: keep the packaged executable/bundle name stable even though the
# user-facing product brand is Codex Fusion. Installers, scheduled tasks, and
# existing upgrades still resolve Codex Router.exe / Codex Router.app.
productName: Codex Router
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
electronFuses:
  # The packaged Electron executable intentionally runs the trusted installed
  # router entrypoints in Node mode; command-runner.mjs depends on this fuse.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraResources:
  - from: assets/icon.png
    to: icon.png
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target: [dmg, zip]
linux:
  icon: assets/icon.png
  category: Development
  executableName: codex-router-control-center
  target: [AppImage]
win:
  icon: assets/icon.ico
  target: [nsis]
